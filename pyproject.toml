[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prompt-injection-benchmark"
version = "1.0.0"
description = "Comprehensive multilingual prompt injection attack benchmark for evaluating LLM robustness"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Muhammad Saeed Anwar", email = "muhammadsaeedanwar@protonmail.com"}
]
keywords = [
    "prompt-injection",
    "adversarial-attacks",
    "llm-security",
    "benchmark",
    "nlp",
    "multilingual"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.9"
dependencies = [
    "openai>=1.3.0",
    "anthropic>=0.20.0",
    "google-generativeai>=0.5.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "scipy>=1.11.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "pyyaml>=6.0",
    "requests>=2.31.0",
    "tqdm>=4.66.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.9.0",
    "flake8>=6.1.0",
    "isort>=5.12.0",
    "mypy>=1.5.0",
    "pylint>=3.0.0",
]
docs = [
    "sphinx>=7.0.0",
    "sphinx-rtd-theme>=1.3.0",
    "myst-parser>=1.0.0",
]

[project.urls]
"Homepage" = "https://github.com/MuhammadSaeedAnwar/Prompt-Injection-LLM-Benchmark"
"Documentation" = "https://github.com/MuhammadSaeedAnwar/Prompt-Injection-LLM-Benchmark/tree/main/docs"
"Repository" = "https://github.com/MuhammadSaeedAnwar/Prompt-Injection-LLM-Benchmark.git"
"Bug Tracker" = "https://github.com/MuhammadSaeedAnwar/Prompt-Injection-LLM-Benchmark/issues"
"Paper" = "https://doi.org/10.5281/zenodo.19364462"

[tool.setuptools]
packages = ["src"]

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_mode = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 100

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_any_generics = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --strict-markers --tb=short --disable-warnings"
markers = [
    "unit: Unit tests for individual components",
    "integration: Integration tests for pipelines",
    "dataset: Dataset validation tests",
    "slow: Slow running tests",
]
